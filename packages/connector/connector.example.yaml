# Procela on-prem connector — example configuration.
#
# Copy this file to /etc/procela/connector.yaml (or set
# PROCELA_CONNECTOR_CONFIG to a different path) and edit to match
# your environment. After the first successful pairing the
# connector rewrites this file with the issued token and drops the
# pairing code. If the file is mounted read-only, the token is
# printed to stdout instead — paste it back in here under `token:`
# and restart.

# Base URL of your Procela API. No trailing slash needed.
procelaUrl: https://procela.example.com/api/v1

# One-time pairing code from Procela's Settings -> Connectors page.
# Remove after first run; the connector will replace it with a
# `token:` line.
pairingCode: "12345678"

# Cadences. Heartbeats are cheap; scans walk every configured
# source so keep this generous (default: 60s heartbeat, 30m scan).
heartbeatSeconds: 60
scanSeconds: 1800

# Data sources to scan. v1 supports Postgres, SQL Server, and
# MySQL/MariaDB; a single connector container can watch any mix
# of them.
sources:
  - type: postgres
    name: warehouse-prod
    # Connection string stays on-prem. Procela never sees it.
    connectionString: postgres://procela_ro:CHANGE_ME@db.internal:5432/warehouse
    # Optional. Empty = scan only 'public'. Add the schemas you care
    # about.
    schemas:
      - public
      - analytics
    # Optional. If omitted, assets attach to the first system Procela
    # has registered for your org.
    systemId: sys_warehouse_prod

  - type: sqlserver
    name: crm-prod
    # SQL Server connection string. Use TrustServerCertificate=true
    # for self-signed certs on internal servers; drop it if the
    # server presents a CA-signed cert.
    connectionString: Server=sql.internal,1433;Database=CRM;User Id=procela_ro;Password=CHANGE_ME;Encrypt=true;TrustServerCertificate=true
    # Optional schema allowlist. Empty = scan every non-system schema
    # in the connected database (dbo, custom schemas, etc.).
    schemas:
      - dbo
      - sales
    systemId: sys_crm_prod

  - type: mysql
    name: billing-prod
    # mysql2 URL form. Add ?ssl=true (or ssl-mode=REQUIRED as a
    # query param) for TLS. Standard MySQL and MariaDB both work.
    connectionString: mysql://procela_ro:CHANGE_ME@mysql.internal:3306/billing?ssl=true
    # Optional. Empty = scan every non-system schema
    # (skips mysql, sys, information_schema, performance_schema).
    schemas:
      - billing
      - reporting
    systemId: sys_billing_prod

  - type: oracle
    name: erp-prod
    # oracle://user:pass@host:port/service_name. Runs in oracledb's
    # thin mode — no Oracle Instant Client needed. The path is the
    # service name (or SID).
    connectionString: oracle://procela_ro:CHANGE_ME@oracle.internal:1521/ORCLPDB1
    # Optional owner allowlist (case-insensitive). Empty = scan the
    # connecting user's own schema (owner = USER).
    schemas:
      - FINANCE
      - HR
    systemId: sys_erp_prod

  - type: dbt
    name: analytics-dbt
    # Path to a dbt manifest.json on disk (from `dbt compile` / `dbt
    # run`). Read locally — no database connection, no network to dbt.
    # Ships each model / source / seed / snapshot as an asset with its
    # columns. For full lineage + dbt tests, feed the same manifest
    # through the in-app dbt import.
    manifestPath: /project/target/manifest.json
    systemId: sys_warehouse
