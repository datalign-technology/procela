apiVersion: v1
kind: Service
metadata:
  name: {{ include "procela.fullname" . }}-backend
  labels:
    {{- include "procela.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.containerPort }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "procela.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
