{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "procela.fullname" . }}
  labels:
    {{- include "procela.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ required "ingress.tls.secretName is required when ingress.tls.enabled=true" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # The frontend Nginx serves the SPA and proxies /api to the
          # backend, so a single backend target covers both.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "procela.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.containerPort }}
{{- end }}
