# CodeQL configuration for Procela.
#
# Runs the same security-extended suite as before, with one query
# filtered out: js/missing-rate-limiting.
#
# Why the exclusion: Procela DOES rate-limit its API. A custom,
# Redis-backed limiter lives in
# packages/backend/src/middleware/rate-limit.ts and is applied both
# per-route (login, password reset, support) and as a coarse per-IP
# /api/v1 backstop wired in index.ts. CodeQL's js/missing-rate-limiting
# query, however, only recognises a fixed set of limiter *libraries*
# (express-rate-limit and friends) and cannot see a first-party
# middleware — so it flags every authenticated route that reaches the
# DB, producing ~34 false positives with no true positives. Excluding
# this one query keeps the rest of security-extended (injection, unsafe
# deserialization, tainted-flow, open redirects, …) fully active.
#
# If the limiter is ever replaced with a CodeQL-modelled library, drop
# this filter so the query's coverage comes back.
name: "Procela CodeQL config"

queries:
  - uses: security-extended

# Unit tests are excluded from analysis. Test harnesses legitimately do
# things the security-extended suite treats as vulnerabilities — most
# notably the shared `request()` helper (used across ~a dozen route
# tests) opens a real socket to an ephemeral localhost server, which
# CodeQL reports as request-forgery / "file data in outbound network
# request" (js/request-forgery, js/file-access-to-http) whenever the
# request path or body derives from a response body or a file-backed
# in-memory store. These are false positives with no production
# analogue — test code is never deployed and is not attack surface — and
# they only surface on *new/changed* test files, so they penalise adding
# test coverage. Excluding the test tree keeps SAST focused on shipped
# code. Remove a pattern here if a test directory ever ships in a build.
paths-ignore:
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"

# Also excluded: js/file-access-to-http ("file data in outbound network
# request"). Procela's job is to store connection configs (dbt Cloud
# tokens, connection credentials, OIDC client secrets) and then call the
# systems they describe — so a stored value reaching an outbound request
# is the core, intended data flow, not exfiltration. The query cannot
# distinguish "send this API token to its own API" from "leak a file to a
# random host", and the stored secrets are now KMS-encrypted at rest with
# writes gated to EDITOR+ by RBAC. It produced only by-design positives
# (e.g. the dbt Cloud auth header). Excluding it keeps the rest of
# security-extended active. Revisit if the app ever reads arbitrary
# user-supplied files and forwards them.
query-filters:
  - exclude:
      id: js/missing-rate-limiting
  - exclude:
      id: js/file-access-to-http
