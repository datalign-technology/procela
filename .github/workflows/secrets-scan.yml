name: Secrets scan

# Fails the build if a committed credential is detected. Scans the full git
# history on every push/PR with gitleaks, using the repo's .gitleaks.toml
# (which allowlists a few reviewed synthetic fixtures — see that file).
#
# Runs the gitleaks binary directly rather than the Marketplace action, which
# needs a license key for organization accounts. The binary needs none.
#
# To make this a merge gate, mark "Secrets scan / gitleaks" as a required
# status check in the branch protection rules.

on:
  push:
    branches: [create-procela-main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.21.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks scans every commit

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
