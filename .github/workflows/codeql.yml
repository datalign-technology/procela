name: CodeQL

# Static application security testing (SAST) for Procela — checklist #22.
# CodeQL compiles the repo into a queryable database and runs GitHub's
# security query suite over the backend, frontend, and connector
# (all JavaScript/TypeScript). Findings land as code-scanning alerts in
# the repo's Security → Code scanning tab, with the source→sink data-flow
# path for each. This complements the dependency audit (which covers
# vulnerable *libraries*) by checking the code we wrote — injection,
# unsafe deserialization, tainted-input-to-dangerous-sink, open redirects.
#
# ── Code scanning ─────────────────────────────────────────────────────
# Code scanning must be enabled for SARIF upload to succeed:
#   • public repos — free, always available (this repo is public);
#   • private repos — requires GitHub Advanced Security
#     (Settings → Code security → Code scanning).
# Because the repo is public, the `pull_request:` trigger below is on:
# each PR gets a CodeQL run whose findings appear as inline annotations
# on the changed lines (and as code-scanning alerts). Push + weekly
# schedule still run the full analysis on the default branch. If this
# repo is ever made private WITHOUT Advanced Security, drop the
# `pull_request:` trigger again so the upload failure doesn't red-X PRs.

on:
  push:
    branches: [create-procela-main]
  pull_request:
    branches: [create-procela-main]
  schedule:
    # Weekly — Mondays 07:00 UTC. Catches newly-published CodeQL queries
    # against code that hasn't changed, without adding per-push cost.
    - cron: '0 7 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # analyze uploads SARIF results as code-scanning alerts.
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # One language covers all three packages — they're all JS/TS.
          languages: javascript-typescript
          # Query suite + filters live in the config file so the
          # security-extended selection and the js/missing-rate-limiting
          # exclusion (the repo's custom limiter isn't CodeQL-modelled —
          # see the config for the full rationale) are versioned together.
          config-file: ./.github/codeql/codeql-config.yml

      # JavaScript/TypeScript needs no build — CodeQL analyzes the source
      # directly, so there is no autobuild step. (A compiled language
      # would need `github/codeql-action/autobuild` here.)

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
