services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: procela
      POSTGRES_PASSWORD: procela
      POSTGRES_DB: procela
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procela"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Local SMTP catcher. Accepts every message the backend sends and shows
  # them in a web inbox — nothing leaves your machine. This is what makes
  # "Report a problem" (and password-reset email) actually deliver in dev:
  # open the inbox to read what would have been sent to support@procela.ai.
  #   • SMTP  → mailpit:1025 (in-network) / localhost:1025 (host)
  #   • Inbox → http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox
    environment:
      # Accept whatever credentials the backend presents (dev only) so the
      # nodemailer AUTH handshake always succeeds against the catcher.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # Applies the Prisma schema to Postgres before the backend starts. The
  # backend image runs `node dist/index.js` only — migrations are a separate
  # step (the same split as the Helm migrate-hook Job in production). Without
  # this, the backend boots against an empty database and every query fails
  # with `relation "..." does not exist` (42P01). Runs once and exits; it
  # reuses the backend image, so it adds no extra build.
  migrate:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://procela:procela@postgres:5432/procela
    volumes:
      - ./packages/backend/prisma:/app/prisma
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://procela:procela@postgres:5432/procela
      REDIS_URL: redis://redis:6379
      # Point outbound mail at the Mailpit catcher. These override anything
      # in .env for the dev stack; for real SMTP in Docker, edit these.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USER: dev
      SMTP_PASS: dev
      SMTP_SECURE: "false"
      MAIL_FROM: "Procela (dev) <noreply@procela.local>"
      APP_URL: http://localhost:3000
      SUPPORT_EMAIL: support@procela.ai
    volumes:
      - ./packages/backend/src:/app/src
      - ./packages/backend/prisma:/app/prisma

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    ports:
      # The frontend image serves via nginx on port 80 (see
      # packages/frontend/nginx.conf + Dockerfile EXPOSE 80), so the host
      # port must map to container 80 — mapping to 3000 hits nothing and the
      # browser gets ERR_CONNECTION_RESET.
      - "3000:80"
    depends_on:
      - backend

  # ── Edge-connector demo (profile: demo) ───────────────────────────────────
  # `docker compose --profile demo up --build` brings up the normal stack PLUS
  # a real on-prem edge connector reading a real source database seeded with the
  # utility + shipbuilder test data. See docs/edge-connector-demo.md.
  #
  # These services only start when the `demo` profile is requested, so a plain
  # `docker compose up` is unchanged.

  # A stand-in for the CUSTOMER's operational database — NOT Procela's store.
  # The connector reads this; Procela never sees its rows, only aggregate DQ
  # counts. Seeded from docker/demo/source-db/init/*.sql on first boot.
  source-db:
    image: postgres:16-alpine
    profiles: ["demo"]
    environment:
      POSTGRES_DB: source_demo
      # Trust auth keeps the demo credential-free; the connector connects as
      # the postgres user with no password. Never do this outside a demo.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./docker/demo/source-db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d source_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Seeds the Procela app tenant (org, admin, systems) so the connector has a
  # home to pair into. Runs once and exits.
  demo-seed:
    image: node:20-slim
    profiles: ["demo"]
    working_dir: /repo
    volumes:
      - ./:/repo:ro
    depends_on:
      backend:
        condition: service_started
    # node:20-slim ships neither wget nor curl, so poll health with Node's
    # built-in fetch — otherwise the wait loops forever against a backend that
    # is actually up, and the seed never runs.
    command: >
      sh -c "until node -e 'fetch(\"http://backend:3001/api/v1/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; do echo 'waiting for backend'; sleep 2; done;
             node packages/backend/scripts/seed-tidewater.js http://backend:3001/api/v1"
    restart: "no"

  # UTILITY tenant connector. Pairs into Tidewater Utilities and scans ONLY the
  # `utility` schema, so that tenant discovers just its own tables. Writes
  # connector.yaml to the shared config volume. Runs once and exits.
  demo-bootstrap:
    image: node:20-slim
    profiles: ["demo"]
    working_dir: /repo
    volumes:
      - ./:/repo:ro
      - connector_config:/config
    environment:
      PROCELA_URL: http://backend:3001/api/v1
      ADMIN_EMAIL: admin@tidewater-utilities.com
      SOURCE_DSN: postgres://postgres@source-db:5432/source_demo
      CONNECTOR_NAME: Tidewater Edge Connector
      SCHEMAS: utility
      OUT: /config/connector.yaml
      SCAN_SECONDS: "30"
      HEARTBEAT_SECONDS: "15"
    depends_on:
      source-db:
        condition: service_healthy
      demo-seed:
        condition: service_completed_successfully
    command: ["node", "docker/demo/bootstrap.mjs"]
    restart: "no"

  # The real UTILITY on-prem agent. Reads its config, discovers the utility
  # tables, reports them into Tidewater Utilities, and runs measured DQ.
  connector:
    build:
      context: ./packages/connector
      dockerfile: Dockerfile
    profiles: ["demo"]
    environment:
      PROCELA_CONNECTOR_CONFIG: /etc/procela/connector.yaml
    volumes:
      - connector_config:/etc/procela:ro
    depends_on:
      demo-bootstrap:
        condition: service_completed_successfully

  # SHIPBUILDER tenant. Seeds Momentum Industries (a shipbuilding company) so
  # its shipbuilder data has a separate home, keeping the two industries'
  # catalogs cleanly apart. Runs once and exits.
  demo-seed-ship:
    image: node:20-slim
    profiles: ["demo"]
    working_dir: /repo
    volumes:
      - ./:/repo:ro
    depends_on:
      backend:
        condition: service_started
    command: >
      sh -c "until node -e 'fetch(\"http://backend:3001/api/v1/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'; do echo 'waiting for backend'; sleep 2; done;
             node packages/backend/scripts/seed-momentum-governance.js http://backend:3001/api/v1"
    restart: "no"

  # SHIPBUILDER tenant connector. Pairs into Momentum Industries and scans ONLY
  # the `shipbuilder` schema. Writes ship-connector.yaml to the shared volume.
  demo-bootstrap-ship:
    image: node:20-slim
    profiles: ["demo"]
    working_dir: /repo
    volumes:
      - ./:/repo:ro
      - connector_config:/config
    environment:
      PROCELA_URL: http://backend:3001/api/v1
      ADMIN_EMAIL: admin@momentumindustries.com
      SOURCE_DSN: postgres://postgres@source-db:5432/source_demo
      CONNECTOR_NAME: Momentum Edge Connector
      SCHEMAS: shipbuilder
      OUT: /config/ship-connector.yaml
      SCAN_SECONDS: "30"
      HEARTBEAT_SECONDS: "15"
    depends_on:
      source-db:
        condition: service_healthy
      demo-seed-ship:
        condition: service_completed_successfully
    command: ["node", "docker/demo/bootstrap.mjs"]
    restart: "no"

  # The real SHIPBUILDER on-prem agent. Discovers the shipbuilder tables and
  # reports them into Momentum Industries.
  connector-ship:
    build:
      context: ./packages/connector
      dockerfile: Dockerfile
    profiles: ["demo"]
    environment:
      PROCELA_CONNECTOR_CONFIG: /etc/procela/ship-connector.yaml
    volumes:
      - connector_config:/etc/procela:ro
    depends_on:
      demo-bootstrap-ship:
        condition: service_completed_successfully

volumes:
  postgres_data:
  connector_config:
